name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - name: Secret hygiene check
        run: |
          if grep -RInE 'sk-[A-Za-z0-9]{20,}|x-rapidapi-proxy-secret:[[:space:]]*[^$[:space:]]+' --exclude-dir=.git --exclude='*.lock' .; then
            echo 'Potential secret found'; exit 1;
          fi
