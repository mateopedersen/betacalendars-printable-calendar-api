name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - name: Secret hygiene check
        run: |
          if git grep -I -nE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|BEGIN[^[:cntrl:]]*PRIVATE KEY' -- ':!.github/workflows/ci.yml'; then
            echo 'Potential secret found'; exit 1;
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '.env must not be tracked'; exit 1;
          fi
