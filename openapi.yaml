    "/v1/month/{year}/{month}": {
      "get": {
        "summary": "Generate a month grid",
        "description": "Build a deterministic Gregorian month model with configurable weekday order, natural or fixed six-week rows, adjacent dates, topology, and a month reference.",
        "tags": [
          "Calendar"
        ],
        "parameters": [
          {
            "name": "year",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9999
            },
            "description": "Gregorian civil year."
          },
          {
            "name": "month",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 12
            },
            "description": "Month number, 1 through 12."
          },
          {
            "name": "weekStart",
            "in": "query",
            "required": false,
            "description": "First weekday in the displayed grid. Default: monday.",
            "schema": {
              "type": "string",
              "enum": [
                "sunday",
                "monday",
                "tuesday",
                "wednesday",
                "thursday",
                "friday",
                "saturday"
              ],
              "default": "monday"
            }
          },
          {
            "name": "gridMode",
            "in": "query",
            "required": false,
            "description": "Choose the minimum natural row count or exactly six rows. Default: natural.",
            "schema": {
              "type": "string",
              "enum": [
                "natural",
                "fixed-six-weeks"
              ],
              "default": "natural"
            }
          },
          {
            "name": "adjacentDays",
            "in": "query",
            "required": false,
            "description": "Show neighboring dates, leave cells empty, or mark explicit placeholders. Default: include.",
            "schema": {
              "type": "string",
              "enum": [
                "include",
                "hide",
                "placeholder"
              ],
              "default": "include"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MonthGrid"
                },
                "examples": {
                  "january-2027": {
                    "summary": "January 2027, Monday-first",
                    "value": {
                      "year": 2027,
                      "month": 1,
                      "monthName": "January",
                      "daysInMonth": 31,
                      "firstWeekday": "friday",
                      "lastWeekday": "sunday",
                      "weekStart": "monday",
                      "gridMode": "natural",
                      "rowCount": 6,
                      "leadingCells": 4,
                      "trailingCells": 7
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/v1/print-layout/{year}/{month}": {
      "get": {
        "summary": "Calculate printable page geometry",
        "description": "Calculate physical paper dimensions, margins, header bands, month grid, day-cell dimensions, notes region, and fit warnings in millimeters.",
        "tags": [
          "Printable Layout"
        ],
        "parameters": [
          {
            "name": "year",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9999
            },
            "description": "Gregorian civil year."
          },
          {
            "name": "month",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 12
            },
            "description": "Month number, 1 through 12."
          },
          {
            "name": "paper",
            "in": "query",
            "required": false,
            "description": "ISO or North American paper preset. Default: a4.",
            "schema": {
              "type": "string",
              "enum": [
                "a4",
                "letter",
                "a5",
                "legal"
              ],
              "default": "a4"
            }
          },
          {
            "name": "orientation",
            "in": "query",
            "required": false,
            "description": "Page orientation. Default: portrait.",
            "schema": {
              "type": "string",
              "enum": [
                "portrait",
                "landscape"
              ],
              "default": "portrait"
            }
          },
          {
            "name": "margin",
            "in": "query",
            "description": "Uniform margin in mm (0–50).",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 50,
              "default": 10
            }
          },
          {
            "name": "headerHeight",
            "in": "query",
            "description": "Reserved title band in mm (0–100).",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 100,
              "default": 22
            }
          },
          {
            "name": "weekdayHeaderHeight",
            "in": "query",
            "description": "Weekday label band in mm (0–50).",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 50,
              "default": 10
            }
          },
          {
            "name": "notesHeight",
            "in": "query",
            "description": "Notes band below the calendar in mm (0–150).",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 150,
              "default": 35
            }
          },
          {
            "name": "weekStart",
            "in": "query",
            "required": false,
            "description": "First weekday. Default: monday.",
            "schema": {
              "type": "string",
              "enum": [
                "sunday",
                "monday",
                "tuesday",
                "wednesday",
                "thursday",
                "friday",
                "saturday"
              ],
              "default": "monday"
            }
          },
          {
            "name": "gridMode",
            "in": "query",
            "required": false,
            "description": "Month row policy. Default: natural.",
            "schema": {
              "type": "string",
              "enum": [
                "natural",
                "fixed-six-weeks"
              ],
              "default": "natural"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrintLayout"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
