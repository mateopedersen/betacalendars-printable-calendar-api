        "summary": "Generate the 2027 March fixture",
        "description": "March 2027 is a stable, deterministic fixture for examples and regression testing. It returns the actual calculated month grid and the matching human-readable calendar reference.",
        "tags": [
          "2027 Month Snapshots"
        ],
        "parameters": [
          {
            "name": "weekStart",
            "in": "query",
            "required": false,
            "description": "First weekday. Default: monday.",
            "schema": {
              "type": "string",
              "enum": [
                "sunday",
                "monday",
                "tuesday",
                "wednesday",
                "thursday",
                "friday",
                "saturday"
              ],
              "default": "monday"
            }
          },
          {
            "name": "gridMode",
            "in": "query",
            "required": false,
            "description": "Row policy. Default: natural.",
            "schema": {
              "type": "string",
              "enum": [
                "natural",
                "fixed-six-weeks"
              ],
              "default": "natural"
            }
          },
          {
            "name": "adjacentDays",
            "in": "query",
            "required": false,
            "description": "Neighboring date presentation. Default: include.",
            "schema": {
              "type": "string",
              "enum": [
                "include",
                "hide",
                "placeholder"
              ],
              "default": "include"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MonthGrid"
