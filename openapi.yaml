  "openapi": "3.0.3",
  "info": {
    "title": "BetaCalendars Printable Calendar & Layout",
    "version": "1.0.0",
    "description": "Generate deterministic Gregorian month grids, printable page geometry, undated planning grids, and year/range topology as structured JSON.",
    "x-category": "Tools",
    "x-long-description": "## BetaCalendars Printable Calendar & Layout\n\nGenerate deterministic Gregorian calendar structures and physical page measurements for applications, print pipelines, planner tools, and regression tests.\n\n### Why this API\n\nThe service models the calendar month first, then derives its week grid and printable geometry. It supports seven week starts, natural or fixed six-week layouts, explicit adjacent-day behavior, A4/US Letter/A5/Legal page presets, and a true blank undated grid. Geometry is returned in millimeters and is calculated without local-time conversions.\n\n### Endpoint families\n\n- **Calendar:** month grids, year summaries, and stable 2027 monthly fixtures.\n- **Printable Layout:** physical paper geometry, margins, headings, weekday bands, writing cells, and notes area.\n- **Blank Planning:** undated grids with configurable rows and columns.\n- **Ranges & Topology:** chronological month ranges, selected-month comparisons, and grid signatures.\n- **References:** human-readable resources accompanying the API.\n\n### Deterministic model\n\nInputs use Gregorian civil year/month values. The service does not scrape holiday/event sources, infer locale-specific holidays, call external URLs, or store user data. Adjacent dates are derived from the same Gregorian model. Invalid input returns a structured JSON error.\n\n### Paper geometry\n\nDimensions are A4 210 × 297 mm, US Letter 215.9 × 279.4 mm, A5 148 × 210 mm, and US Legal 215.9 × 355.6 mm. Orientation swaps width and height. Margins and reserved regions are subtracted before day-cell dimensions are calculated; warnings identify cramped writing areas.\n\n### Example\n\n`GET /v1/print-layout/2027/1?paper=a4&orientation=portrait&weekStart=monday&gridMode=fixed-six-weeks`\n\n### Human-readable references\n\nThe API accompanies the [Beta Calendars project](https://www.betacalendars.com/) . Printable resources: [Blank Calendar](https://www.betacalendars.com/blank-calendar), [January](https://www.betacalendars.com/january-calendar.html), [February](https://www.betacalendars.com/february-calendar.html), [March](https://www.betacalendars.com/march-calendar.html), [April](https://www.betacalendars.com/april-calendar.html), [May](https://www.betacalendars.com/may-calendar.html), [June](https://www.betacalendars.com/june-calendar.html), [July](https://www.betacalendars.com/july-calendar.html), [August](https://www.betacalendars.com/august-calendar.html), [September](https://www.betacalendars.com/september-calendar.html), [October](https://www.betacalendars.com/october-calendar.html), [November](https://www.betacalendars.com/november-calendar.html), [December](https://www.betacalendars.com/december-calendar.html).",
    "x-website": "https://www.betacalendars.com/",
    "x-public": false,
    "termsOfService": "https://www.betacalendars.com/terms-of-service"
  },
